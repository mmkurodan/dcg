plugins {
    id 'com.android.application'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def compilerLibsDir = layout.projectDirectory.dir("libs")
def bundledCompilerJars = [
        "ecj.jar",
        "org.eclipse.jdt.core.jar",
        "org.eclipse.jdt.compiler.tool.jar",
        "org.eclipse.jdt.compiler.apt.jar"
]
def sourceVersionStubSourcesDir = layout.projectDirectory.dir("stubs")
def sourceVersionStubClassesDir = layout.buildDirectory.dir("generated/sourceversion-stub/classes")

android {
    namespace "com.micklab.dcg"
    compileSdk 35

    defaultConfig {
        applicationId "com.micklab.dcg"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/INDEX.LIST',
                    'META-INF/*.kotlin_module',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

tasks.register("compileSourceVersionStub", JavaCompile) {
    source = fileTree(sourceVersionStubSourcesDir) {
        include "**/*.java"
    }
    classpath = files()
    destinationDirectory = sourceVersionStubClassesDir
    sourceCompatibility = JavaVersion.VERSION_1_8.toString()
    targetCompatibility = JavaVersion.VERSION_1_8.toString()
    options.release = 8
}

tasks.register("buildSourceVersionStubJar", Jar) {
    dependsOn("compileSourceVersionStub")
    archiveFileName = "sourceversion-stub.jar"
    destinationDirectory = compilerLibsDir
    from(sourceVersionStubClassesDir)
}

tasks.register("verifyBundledCompilerJars") {
    inputs.files(bundledCompilerJars.collect { compilerLibsDir.file(it).asFile })
    doLast {
        bundledCompilerJars.each { fileName ->
            File candidate = compilerLibsDir.file(fileName).asFile
            if (!candidate.isFile()) {
                throw new GradleException("Missing required compiler bundle: app/libs/" + fileName)
            }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("buildSourceVersionStubJar", "verifyBundledCompilerJars")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    // ecj.jar already bundles the batch compiler plus the tool/apt bytecode.
    // The split JDT jars still live in app/libs to make the expected Android-side layout explicit.
    implementation files(
            "${projectDir}/libs/ecj.jar",
            "${projectDir}/libs/sourceversion-stub.jar"
    )
    implementation 'com.android.tools:r8:8.5.35'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
}
