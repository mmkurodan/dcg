import com.micklab.dcg.build.wrapper.WrapperGenerationTask

plugins {
    id 'com.android.application'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

def compilerLibsDir = layout.projectDirectory.dir("libs")
// JDT 4.6-era artifacts are bundled explicitly so the app never falls back to newer
// desktop-oriented JDT jars that reference java.lang.Runtime$Version on Android.
def bundledCompilerJars = [
        "ecj-4.6.jar",
        "org.eclipse.jdt.core-3.12.0.jar",
        "org.eclipse.jdt.compiler.tool-1.2.0.jar",
        "org.eclipse.jdt.compiler.apt-1.2.100.jar"
]
def packagedCompilerRuntimeJars = [
        "ecj-4.6.jar",
        "sourceversion-stub.jar"
]
def allBundledLibs = fileTree(dir: "${projectDir}/libs", include: ['*.jar'])
def sourceVersionStubSourcesDir = layout.projectDirectory.dir("stubs")
def sourceVersionStubClassesDir = layout.buildDirectory.dir("generated/sourceversion-stub/classes")
def generatedWrapperSourceDir = layout.projectDirectory.dir("src/main/java/com/micklab/dcg/wrapper/android")
def generatedWrapperClasspathClassesDir = layout.buildDirectory.dir("generated/wrapper-classpath/classes")
def generatedWrapperClasspathJarDir = layout.buildDirectory.dir("generated/wrapper-classpath/jar")
def generatedWrapperClasspathJarName = "android-wrapper-classpath.jar"
def forbiddenJdtSymbol = "java/lang/Runtime\$Version"

def jarContainsText = { File jarFile, String marker ->
    boolean found = false
    new java.util.jar.JarFile(jarFile).withCloseable { jar ->
        def entries = jar.entries()
        while (entries.hasMoreElements() && !found) {
            def entry = entries.nextElement()
            if (entry.isDirectory()) {
                continue
            }
            jar.getInputStream(entry).withCloseable { input ->
                found = new String(input.bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains(marker)
            }
        }
    }
    return found
}

configurations {
    compilerBundle
}

android {
    namespace "com.micklab.dcg"
    compileSdk 35

    defaultConfig {
        applicationId "com.micklab.dcg"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/INDEX.LIST',
                    'META-INF/*.kotlin_module',
                    'META-INF/eclipse.inf',
                    'META-INF/AL2.0',
                    'META-INF/LGPL2.1'
            ]
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['src/main/assets']
            java {
                exclude 'com/micklab/dcg/wrapper/android/**'
            }
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

tasks.register("compileSourceVersionStub", JavaCompile) {
    source = fileTree(sourceVersionStubSourcesDir) {
        include "**/*.java"
    }
    classpath = files()
    destinationDirectory = sourceVersionStubClassesDir
    sourceCompatibility = JavaVersion.VERSION_1_8.toString()
    targetCompatibility = JavaVersion.VERSION_1_8.toString()
    options.release = 8
}

tasks.register("buildSourceVersionStubJar", Jar) {
    dependsOn("compileSourceVersionStub")
    archiveFileName = "sourceversion-stub.jar"
    destinationDirectory = compilerLibsDir
    from(sourceVersionStubClassesDir)
}

tasks.register("verifyBundledCompilerJars") {
    inputs.files(bundledCompilerJars.collect { compilerLibsDir.file(it).asFile })
    doLast {
        bundledCompilerJars.each { fileName ->
            File candidate = compilerLibsDir.file(fileName).asFile
            if (!candidate.isFile()) {
                throw new GradleException("Missing required compiler bundle: app/libs/" + fileName)
            }
            if (jarContainsText(candidate, forbiddenJdtSymbol)) {
                throw new GradleException("Bundled compiler jar app/libs/" + fileName
                        + " still references java.lang.Runtime\$Version. Replace it with the Android-compatible ECJ 4.6-era bundle.")
            }
        }
    }
}

def androidJarProvider = providers.provider {
    File projectRoot = rootProject.projectDir
    List<File> candidates = [
            new File(projectRoot, "Android.jar"),
            new File(projectRoot, "android.jar")
    ]
    File androidJar = candidates.find { it.isFile() }
    if (androidJar == null) {
        throw new GradleException("Project-root Android.jar/android.jar not found. Place it at: "
                + new File(projectRoot, "Android.jar").absolutePath)
    }
    androidJar
}

tasks.register("generateAndroidApiWrappers", WrapperGenerationTask) {
    androidJar.set(layout.file(androidJarProvider))
    outputDirectory.set(generatedWrapperSourceDir)
    wrapperRootPackage.set("com.micklab.dcg.wrapper.android")
    securityPolicyPrefix.set("blocked:")
}

tasks.register("compileAndroidWrapperClasspath", JavaCompile) {
    dependsOn("generateAndroidApiWrappers")
    source = fileTree(generatedWrapperSourceDir) {
        include "**/*.java"
    }
    classpath = files(layout.file(androidJarProvider))
    destinationDirectory = generatedWrapperClasspathClassesDir
    sourceCompatibility = JavaVersion.VERSION_1_8.toString()
    targetCompatibility = JavaVersion.VERSION_1_8.toString()
    options.release = 8
}

tasks.register("buildAndroidWrapperClasspathJar", Jar) {
    dependsOn("compileAndroidWrapperClasspath")
    archiveFileName = generatedWrapperClasspathJarName
    destinationDirectory = generatedWrapperClasspathJarDir
    from(generatedWrapperClasspathClassesDir)
}

tasks.register("stageAndroidWrapperClasspathAsset", Copy) {
    dependsOn("buildAndroidWrapperClasspathJar")
    from(generatedWrapperClasspathJarDir.map { it.file(generatedWrapperClasspathJarName) })
    into(layout.projectDirectory.dir("src/main/assets/java-wrapper"))
}

tasks.named("preBuild").configure {
    dependsOn(
            "buildSourceVersionStubJar",
            "verifyBundledCompilerJars")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.0'
    compilerBundle allBundledLibs
    // The full 4.6-era compiler bundle lives in app/libs for inspection and packaging checks.
    // ECJ 4.6 already contains the overlapping batch compiler classes, so only ECJ itself plus
    // the SourceVersion stub join the APK classpath; the core/tool/apt jars stay on disk as the
    // documented scaffold bundle without triggering duplicate classes during packaging.
    implementation files(packagedCompilerRuntimeJars.collect { "${projectDir}/libs/${it}" })
    implementation 'com.android.tools:r8:8.5.35'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    testImplementation 'junit:junit:4.13.2'
}
